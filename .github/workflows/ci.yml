name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth-service, auction-service, bidding-service, notification-service]
    defaults:
      run:
        working-directory: platform/backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: platform/backend/${{ matrix.service }}/pom.xml

      # Compiles, runs unit tests and the integration tests. Those start Postgres through Testcontainers,
      # which uses the Docker daemon that is already on the runner.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: platform/backend/${{ matrix.service }}/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  scripts:
    name: smoke scripts (syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The scripts need the whole stack running, so CI only checks that they still parse.
      - run: bash -n scripts/smoke-auth.sh scripts/smoke-flow.sh scripts/demo-kafka-outage.sh scripts/db-reset.sh scripts/seed.sh
      - run: node --check scripts/ws-listen.mjs

  # Checks that the compose file is valid and that every Dockerfile builds. Nothing is started or pushed.
  docker:
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile app config -q
      - run: docker compose --profile app build
