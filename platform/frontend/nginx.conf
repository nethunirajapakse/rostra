server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Using a variable in proxy_pass makes nginx look the gateway up per request,
    # so nginx still starts if the gateway container is not ready yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8080;

    # Same paths the Vite dev server proxies (see vite.config.ts). SPA routes such as /mine do not match.
    # Photo uploads are up to 5 MB each (the service enforces the limit; nginx's default would stop them at 1 MB).
    client_max_body_size 6m;

    location ~ ^/(auth/|auctions(/|$)|bids(/|$)|me/) {
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    # Hashed build assets can be cached for a long time; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
