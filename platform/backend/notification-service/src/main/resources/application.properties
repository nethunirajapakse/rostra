spring.application.name=notification-service
server.port=8084

spring.config.import=optional:file:platform/backend/notification-service/.env[.properties]

# Database
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/rostra_notification}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:rostra}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT (Shared Secret)
app.jwt.secret=${APP_JWT_SECRET}

# Kafka consumer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Topic names
app.kafka.topics.bid-placed=bid.placed
app.kafka.topics.auction-ended=auction.ended