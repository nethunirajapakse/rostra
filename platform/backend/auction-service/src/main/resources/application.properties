spring.application.name=auction-service
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/rostra_auction
spring.datasource.username=rostra
spring.datasource.password=rostra_dev_pw
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN

# JWT: shared with the auth-service. JWT_SECRET is required (raw UTF-8, at least 32 bytes).
app.jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Events are serialized to JSON text by the outbox, so the producer just sends strings.
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.jackson.serialization.write-dates-as-timestamps=false

app.kafka.topics.auction-ended=auction.ended

springdoc.swagger-ui.path=/swagger-ui.html

spring.task.scheduling.pool.size=2