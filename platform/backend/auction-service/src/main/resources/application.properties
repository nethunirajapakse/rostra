spring.application.name=auction-service
server.port=8082

# Defaults match docker-compose.yml; the containers override them with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rostra_auction}
spring.datasource.username=${DB_USERNAME:rostra}
spring.datasource.password=${DB_PASSWORD:rostra_dev_pw}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=WARN

# JWT: shared with the auth-service. JWT_SECRET is required (raw UTF-8, at least 32 bytes).
app.jwt.secret=${JWT_SECRET}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Events are serialized to JSON text by the outbox, so the producer just sends strings.
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.jackson.serialization.write-dates-as-timestamps=false

app.kafka.topics.auction-ended=auction.ended

springdoc.swagger-ui.path=/swagger-ui.html

spring.task.scheduling.pool.size=2

# --- Image storage (RustFS in docker-compose; any S3-compatible store works) ---
app.media.endpoint=${MEDIA_ENDPOINT:http://localhost:9000}
app.media.bucket=${MEDIA_BUCKET:auction-images}
app.media.access-key=${MEDIA_ACCESS_KEY:rostra-dev-key}
app.media.secret-key=${MEDIA_SECRET_KEY:rostra-dev-secret-0123}
app.media.region=${MEDIA_REGION:us-east-1}
app.media.max-file-bytes=5242880
app.media.max-images-per-auction=5
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
