spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:500ms}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
            - id: auction-service
              uri: ${AUCTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/auctions/**
            - id: bidding-service
              uri: ${BIDDING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/bids/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/me/notifications/**
            # The signed-in user's watchlist lives in auction-service (the other watch endpoints sit under /auctions).
            - id: auction-watchlist
              uri: ${AUCTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/me/watchlist/**
            # Live notifications. ws:// makes the gateway proxy the WebSocket upgrade; the cookie is validated
            # by JwtEdgeFilter exactly like a normal request, then notification-service authenticates it again.
            - id: notification-ws
              uri: ${NOTIFICATION_WS_URL:ws://localhost:8084}
              predicates:
                - Path=/ws/notifications
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

app:
  jwt:
    # Required. Same value as every other service. Raw UTF-8 bytes, at least 32 bytes.
    secret: ${JWT_SECRET}
  cookie:
    secure: ${COOKIE_SECURE:false}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
